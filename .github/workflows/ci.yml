name: ci

# Gli stessi controlli che si usano in locale (Makefile, docs/sviluppo/test.md). Nessun segreto:
# l'immagine Docker si costruisce e si prova, ma non si pubblica.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_LICENSES_VERSION: v2.0.1

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dipendenze
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Contrasti dei temi (WCAG)
        run: node scripts/check-contrast.mjs
      - name: Tipi
        working-directory: web
        run: pnpm typecheck
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Licenze npm (solo permissive)
        working-directory: web
        run: node ../scripts/check-npm-licenses.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: webui
          path: internal/webui/dist/app
          retention-days: 1
          if-no-files-found: error

  go:
    name: Backend
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # I test di integrazione falliscono invece di saltare se non trovano Postgres 18.
      REGIA_ITEST_REQUIRE_PG: "18"
    steps:
      - uses: actions/checkout@v4

      # Il binario include il frontend (go:embed): serve quello appena compilato.
      - uses: actions/download-artifact@v4
        with:
          name: webui
          path: internal/webui/dist/app

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Postgres 18 per i test di integrazione
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq --no-install-recommends postgresql-18 postgresql-18-pgvector
          echo "REGIA_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/postgres --version
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Formattazione
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./migrations)
          if [ -n "$unformatted" ]; then echo "File da formattare con gofmt:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (con race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: make build

      - name: Cache di go-licenses
        uses: actions/cache@v4
        with:
          path: ~/go/bin/go-licenses
          key: go-licenses-${{ env.GO_LICENSES_VERSION }}-${{ runner.os }}
      - name: Licenze Go (solo permissive)
        run: |
          test -x ~/go/bin/go-licenses || go install github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}
          ~/go/bin/go-licenses check ./... --ignore regia --disallowed_types=forbidden,restricted,unknown

  docker:
    name: Immagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: regia:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Dimensione
        run: docker image ls regia:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prova di avvio, doctor, backup e arresto
        run: |
          docker run -d --name regia -p 127.0.0.1:8080:8080 regia:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz
          docker exec regia regia doctor
          docker exec regia regia backup
          docker stop -t 60 regia
          docker logs regia 2>&1 | tail -n 5
          docker logs regia 2>&1 | grep -q "Postgres incluso arrestato"
